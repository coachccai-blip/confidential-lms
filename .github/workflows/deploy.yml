name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publication par le mécanisme officiel de GitHub Pages plutôt que par une
# branche `gh-pages`. L'étape `configure-pages` bascule elle-même la source du
# site sur « GitHub Actions » : le dépôt ne peut donc plus servir par erreur la
# racine de `main`, où Jekyll rendait le README à la place de l'application.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La version de pnpm est lue depuis le champ `packageManager` du package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérification des types
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      # `enablement: true` active Pages et fixe la source sur les Actions.
      - name: Configuration de GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build de l'application web
        # `base` doit correspondre au chemin servi par GitHub Pages : /<repo>/
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Préparation de l'artefact
        run: |
          cd apps/web/dist
          # Repli SPA : le routeur est en mode hash, mais une URL inconnue doit
          # tout de même charger l'application au lieu du 404 de GitHub.
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
