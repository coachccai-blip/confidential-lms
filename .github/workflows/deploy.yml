name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Le build est publié sur la branche `gh-pages`, servie par GitHub Pages
# (Settings → Pages → Deploy from a branch → gh-pages / root).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Tests, build et publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La version de pnpm est lue depuis le champ `packageManager` du package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérification des types
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      - name: Build de l'application web
        # `base` doit correspondre au chemin servi par GitHub Pages : /<repo>/
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Préparation de l'artefact
        run: |
          cd apps/web/dist
          # Fallback SPA et désactivation de Jekyll (qui ignorerait les fichiers _*).
          cp index.html 404.html
          touch .nojekyll

      - name: Publication sur la branche gh-pages
        run: |
          cd apps/web/dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Déploiement de ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
